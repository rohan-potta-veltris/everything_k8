apiVersion: v1
kind: Service

metadata:
  name: cluster-svc
  labels:
    env: demo

spec:
  type: LoadBalancer #used by default by service if not mentions
  ports:
    - port: 80          # Port exposed by the Service
      targetPort: 80    # Port where the application is running inside the Pod
  selector: #which pod or deployment it should target to 
      env: demo