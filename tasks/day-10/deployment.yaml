apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-ns1
  namespace: ns1
  labels:
    env: day-10
spec:
  template:
    metadata:
      labels:
        env: day-10
    spec:
      containers:
        - name: svc-day10
          image: nginx:1.23.4
          ports:
            - containerPort: 80
  replicas: 1
  selector:
    matchLabels:
      env: day-10