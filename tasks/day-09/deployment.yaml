apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    env: day-09
spec: 
  template:
    metadata: #this is for the pod , so it wont need a name 
      labels:
        env: day-09
    spec:
      containers: 
        - name: svc-day09 # this is for the container so it will need a name
          image: nginx:1.23.4-alpine
          ports:
            - containerPort: 80

  replicas: 2
  selector  :
    matchLabels:
      env: day-09


