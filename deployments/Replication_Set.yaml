apiVersion: apps/v1 #Groups/Versions as show in kubectl explain rs
kind: ReplicaSet
metadata:
  name: nginx-rs
  labels:
    env: demo
spec:
  template: #spec of the pod that it should be created , we don't need kind and apiVersion here
    metadata:
      labels:
        env: demo
        type: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
  replicas: 3 #number of pods to be created
  selector: #selector is used to select the pods that are created by this replication controller
    matchLabels:
      env: demo